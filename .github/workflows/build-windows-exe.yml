name: Build JARVIS Windows EXE

on:
  push:
    branches: [ claude/jarvis-ios-app-ri05gq, main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        working-directory: windows-app
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install customtkinter requests Pillow pyttsx3 SpeechRecognition sounddevice numpy pygame opencv-python pyinstaller
          # PyAudio via binary wheel (no compiler needed on Windows)
          pip install pyaudio --quiet
          if ($LASTEXITCODE -ne 0) {
            Write-Host "PyAudio install failed — continuing without it"
          }

      - name: Copy welcome music placeholder
        working-directory: windows-app
        shell: pwsh
        run: |
          # If welcome.mp3 exists in repo include it; otherwise create empty placeholder
          if (-not (Test-Path "welcome.mp3")) {
            New-Item -ItemType File -Name "welcome.mp3" | Out-Null
          }

      - name: Build EXE with PyInstaller
        working-directory: windows-app
        shell: pwsh
        run: |
          pyinstaller `
            --onefile `
            --windowed `
            --name "JARVIS" `
            --icon "../assets/icon.ico" `
            --add-data "welcome.mp3;." `
            --hidden-import customtkinter `
            --hidden-import PIL `
            --hidden-import PIL._tkinter_finder `
            --hidden-import pyttsx3 `
            --hidden-import pyttsx3.drivers `
            --hidden-import pyttsx3.drivers.sapi5 `
            --hidden-import speech_recognition `
            --hidden-import sounddevice `
            --hidden-import pygame `
            --hidden-import cv2 `
            --collect-all customtkinter `
            --collect-all pygame `
            jarvis.py
        continue-on-error: false

      - name: Build EXE (fallback — sans icone)
        working-directory: windows-app
        if: failure()
        shell: pwsh
        run: |
          pyinstaller `
            --onefile `
            --windowed `
            --name "JARVIS" `
            --add-data "welcome.mp3;." `
            --hidden-import customtkinter `
            --hidden-import PIL `
            --hidden-import PIL._tkinter_finder `
            --hidden-import pyttsx3 `
            --hidden-import pyttsx3.drivers `
            --hidden-import pyttsx3.drivers.sapi5 `
            --hidden-import speech_recognition `
            --hidden-import sounddevice `
            --hidden-import pygame `
            --hidden-import cv2 `
            --collect-all customtkinter `
            --collect-all pygame `
            jarvis.py

      - name: Verify EXE
        working-directory: windows-app
        shell: pwsh
        run: |
          $exe = Get-Item "dist\JARVIS.exe"
          Write-Host "EXE size: $([math]::Round($exe.Length / 1MB, 1)) MB"

      - name: Upload JARVIS.exe
        uses: actions/upload-artifact@v4
        with:
          name: JARVIS-Windows-EXE
          path: windows-app/dist/JARVIS.exe
          retention-days: 30
