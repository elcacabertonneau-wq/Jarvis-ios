workflows:
  ios-build:
    name: JARVIS IPA (non-signé pour Sideloadly)
    max_build_duration: 60
    instance_type: mac_mini_m2

    environment:
      xcode: latest
      vars:
        XCODE_PROJECT: "Jarvis.xcodeproj"
        XCODE_SCHEME: "Jarvis"
        BUILD_DIR: "build/Release-iphoneos"

    scripts:
      - name: Info environnement
        script: |
          xcodebuild -version
          pwd && ls -la

      - name: Build pour device (sans signature)
        script: |
          xcodebuild \
            -project "$XCODE_PROJECT" \
            -scheme "$XCODE_SCHEME" \
            -sdk iphoneos \
            -configuration Release \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            COMPILER_INDEX_STORE_ENABLE=NO \
            CONFIGURATION_BUILD_DIR="$BUILD_DIR" \
            clean build

      - name: Créer IPA
        script: |
          mkdir -p build/Payload
          cp -r "$BUILD_DIR/Jarvis.app" build/Payload/Jarvis.app
          cd build && zip -r Jarvis.ipa Payload/
          echo "IPA créé : $(du -sh Jarvis.ipa)"

    artifacts:
      - build/Jarvis.ipa

    publishing:
      email:
        recipients:
          - elcaca.bertonneau@gmail.com
        notify:
          success: true
          failure: true
