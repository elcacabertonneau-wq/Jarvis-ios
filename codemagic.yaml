workflows:
  ios-build:
    name: JARVIS IPA (non-signé pour Sideloadly)
    max_build_duration: 60
    instance_type: mac_mini_m2

    environment:
      xcode: latest
      vars:
        XCODE_SCHEME: "Jarvis"

    scripts:
      - name: Installer XcodeGen
        script: brew install xcodegen

      - name: Générer le projet Xcode
        script: |
          xcodegen generate --spec project.yml
          xcodebuild -list -project Jarvis.xcodeproj

      - name: Build pour device (sans signature)
        script: |
          xcodebuild \
            -project Jarvis.xcodeproj \
            -target "Jarvis" \
            -sdk iphoneos \
            -configuration Release \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            COMPILER_INDEX_STORE_ENABLE=NO \
            build

      - name: Créer IPA
        script: |
          APP_PATH=$(find . -name "Jarvis.app" -not -path "*simulator*" | head -1)
          echo "App : $APP_PATH"
          mkdir -p build/Payload
          cp -r "$APP_PATH" build/Payload/Jarvis.app
          cd build && zip -r Jarvis.ipa Payload/
          ls -lh Jarvis.ipa

    artifacts:
      - build/Jarvis.ipa

    publishing:
      email:
        recipients:
          - elcaca.bertonneau@gmail.com
        notify:
          success: true
          failure: true
