workflows:
  ios-build:
    name: JARVIS IPA (non-signé pour Sideloadly)
    max_build_duration: 60
    instance_type: mac_mini_m2

    environment:
      xcode: latest
      vars:
        XCODE_PROJECT: "Jarvis.xcodeproj"
        XCODE_SCHEME: "Jarvis"

    scripts:
      - name: Diagnostic complet
        script: |
          echo "=== Xcode version ==="
          xcodebuild -version

          echo "=== Répertoire courant ==="
          pwd
          ls -la

          echo "=== Contenu xcodeproj ==="
          ls -la "$XCODE_PROJECT/"

          echo "=== Schemes disponibles ==="
          ls -la "$XCODE_PROJECT/xcshareddata/xcschemes/" || echo "Pas de schemes partagés"

          echo "=== SDKs disponibles ==="
          xcodebuild -showsdks

          echo "=== Liste du projet ==="
          xcodebuild -list -project "$XCODE_PROJECT"

      - name: Build (target direct, sans scheme)
        script: |
          xcodebuild \
            -project "$XCODE_PROJECT" \
            -target "Jarvis" \
            -sdk iphoneos \
            -configuration Release \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            COMPILER_INDEX_STORE_ENABLE=NO \
            build

      - name: Créer IPA
        script: |
          APP_PATH=$(find . -name "Jarvis.app" -not -path "*/simulator/*" | head -1)
          echo "App trouvée : $APP_PATH"
          mkdir -p build/Payload
          cp -r "$APP_PATH" build/Payload/Jarvis.app
          cd build && zip -r Jarvis.ipa Payload/
          echo "IPA créé : $(du -sh Jarvis.ipa)"

    artifacts:
      - build/Jarvis.ipa

    publishing:
      email:
        recipients:
          - elcaca.bertonneau@gmail.com
        notify:
          success: true
          failure: true
